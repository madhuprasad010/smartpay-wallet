server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:smartpay_redis_pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  wallet:
    url: ${WALLET_SERVICE_URL:http://localhost:8083}
  transaction:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  beneficiary:
    url: ${BENEFICIARY_SERVICE_URL:http://localhost:8086}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  audit:
    url: ${AUDIT_SERVICE_URL:http://localhost:8088}

logging:
  level:
    root: INFO
    com.smartpay.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
