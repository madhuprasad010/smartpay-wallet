# ============================================================
# SmartPay Wallet — Grafana Dashboard Provisioning
# ============================================================

apiVersion: 1

providers:
  - name: "SmartPay Dashboards"
    orgId: 1
    folder: "SmartPay"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
