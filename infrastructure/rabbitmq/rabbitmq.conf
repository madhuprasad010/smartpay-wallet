# ============================================================
# SmartPay Wallet — RabbitMQ Configuration
# ============================================================

# Load definitions on startup
management.load_definitions = /etc/rabbitmq/definitions.json

# Management plugin listener
management.tcp.port = 15672

# Default user (overridden by env vars in docker-compose)
default_user = smartpay
default_pass = changeme_rabbitmq

# Disk free limit (default is fine for dev; raise in production)
disk_free_limit.absolute = 50MB

# Logging
log.console = true
log.console.level = info

# Heartbeat (seconds)
heartbeat = 60
