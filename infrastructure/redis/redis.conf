# ============================================================
# SmartPay Wallet — Redis 7 Configuration
# ============================================================

# --- Network ---
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# --- Memory ---
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Persistence (AOF) ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- RDB snapshots (secondary persistence) ---
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# --- Security ---
# Password is set via command-line --requirepass in docker-compose
# to avoid hardcoding secrets in this file.

# --- Logging ---
loglevel notice

# --- Clients ---
maxclients 10000

# --- Slow log ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Latency monitoring ---
latency-monitor-threshold 100
