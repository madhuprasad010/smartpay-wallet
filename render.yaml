# ============================================================
# SmartPay Wallet — Render Blueprint Specification (Free Tier)
# Infrastructure-as-Code for Free Cloud Deployment on Render
# ============================================================

version: "1"

services:
  # -----------------------------------------------------------
  # 1. FRONTEND: React 19 Static Site (Free Tier CDN)
  # -----------------------------------------------------------
  - type: web
    name: smartpay-web
    runtime: static
    buildCommand: cd frontend/smartpay-web && npm ci && npm run build
    staticPublishPath: frontend/smartpay-web/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartpay-backend.onrender.com/api/v1

  # -----------------------------------------------------------
  # 2. CONSOLIDATED BACKEND: Modular Spring Boot App (Free Tier)
  # -----------------------------------------------------------
  - type: web
    name: smartpay-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=35.0 -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=128m -Xss512k -Djava.security.egd=file:/dev/./urandom"
      - key: JWT_SECRET
        generateValue: true
      # External Database Configuration (TiDB Cloud Starter / MySQL Free Tier)
      - key: TIDB_DATABASE_URL
        sync: false
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      # External Redis Configuration (Upstash Free Tier rediss:// URL)
      - key: UPSTASH_REDIS_URL
        sync: false
      # Optional Message Brokers (Disabled by default on free tier)
      - key: SMARTPAY_KAFKA_ENABLED
        value: "false"
      - key: SMARTPAY_RABBITMQ_ENABLED
        value: "false"
